#
# uTasker MODBUS slave — HALucinator config (in-process unicorn backend).
#
# Target: ARMv7-M (Thumb) STM32, **uTasker RTOS** (a cooperative task scheduler,
# not FreeRTOS/RIOT), running the uTasker **MODBUS slave** demo. The firmware
# string `uTasker-MODBUS-slave` at 0x0801552a identifies the build.
#
# Layout recovered from the ELF (uEmu.uTasker_MODBUS.out, two PT_LOAD segments):
#   vector table  0x0800c080  (ONLY 2 entries: init_SP + Reset -- see note below)
#   code/rodata   0x0800c088 .. 0x08016049
#   init SP       0x2002fffc  (vector[0])
#   reset/entry   0x08015ecd  (vector[1], Thumb bit set)
#
# NOTE (honest): the corpus image is a PARTIAL flash image -- it starts at
# 0x0800c080 (there is a ~48 KB bootloader region below it that is NOT in the
# ELF), and only SP+Reset are present as vectors; everything from 0x0800c088 on
# is code, so there are no IRQ handler vectors to dispatch to. The rehost
# therefore runs the cooperative uTasker scheduler (uTaskerSchedule 0x0800e691)
# rather than relying on interrupt delivery; peripheral events are driven at the
# uTasker driver seam instead. uTaskerMODBUS.bin is this flat image padded from
# 0x08000000 with 0xff so it can be mapped as one flash region.
machine:
  # unicorn's M-profile model is cortex-m3; it covers the ARMv7-M ISA used here.
  arch: cortex-m3
  cpu_model: cortex-m3
  entry_addr: 0x08015ecd        # Reset (vector[1]) | Thumb bit
  init_sp: 0x2002fffc           # vector[0]
  vector_base: 0x0800c080       # VTOR (per the uEmu corpus cfg for this image)
  interrupt_controller:
    type: cortex_m

memories:
  # Flash. The padded image covers 0x08000000..0x08016049; map the whole 256 KB
  # bank so any rodata/config read inside the bank is backed.
  flash:
    base_addr: 0x08000000
    file: uTaskerMODBUS.bin
    permissions: r-x
    size: 0x00040000
  # Main SRAM. init SP = 0x2002fffc, so the bank must cover 0x20000000..0x20030000.
  sram:
    base_addr: 0x20000000
    permissions: rw-
    size: 0x00030000
  # HALucinator's IRQ/exception scratch windows (see backends/irq).
  halucinator-irq:
    base_addr: 0x03ffc000
    size: 0x00004000
  halucinator:
    base_addr: 0x04000000
    size: 0x00100000

peripherals:
  # Catch-all STM32 SoC window, split so the faithfully-modelled RCC page can sit
  # in the middle without overlapping (HALucinator maps 4 kB-aligned regions and
  # rejects overlaps). AutoPeripheral records accesses and applies the busy-wait
  # breaker, so the remaining status polls converge without hand-modelling every
  # register up front.
  soc_low:
    base_addr: 0x40000000
    emulate: halucinator.peripheral_models.auto_model.AutoPeripheral
    permissions: rw-
    size: 0x00023000
  # RCC (reset & clock control) at 0x40023800 — modelled so the firmware's own
  # `enable -> poll for ready` clock bring-up completes on its own terms.
  # See peripheral_models/stm32_rcc.py.
  rcc:
    base_addr: 0x40023000
    emulate: rehostry_utasker_modbus.peripheral_models.stm32_rcc.Stm32Rcc
    permissions: rw-
    size: 0x00001000
  soc_mid:
    base_addr: 0x40024000
    emulate: halucinator.peripheral_models.auto_model.AutoPeripheral
    permissions: rw-
    size: 0x00004000
  # Ethernet MAC (0x40028000) + DMA (0x40029000) — descriptor rings, self-clearing
  # busy bits and a link-up PHY, so the driver's own bring-up/RX walk completes.
  # See peripheral_models/stm32_eth.py.
  eth:
    base_addr: 0x40028000
    emulate: rehostry_utasker_modbus.peripheral_models.stm32_eth.Stm32Eth
    permissions: rw-
    size: 0x00002000
  soc_high:
    base_addr: 0x4002A000
    emulate: halucinator.peripheral_models.auto_model.AutoPeripheral
    permissions: rw-
    size: 0x1FFD6000
  # Cortex-M System Control Space (NVIC/SCB/SysTick at 0xE000E000).
  #
  # This is the AutoPeripheral catch-all with ONE register taken out of its
  # hands: SCB_VTOR (0xE000ED08). See peripheral_models/cortex_m_scs.py
  # (ScsCatchAll) for the disassembly -- uTasker's software frame dispatch does
  # `ldr r4,[VTOR]` / `ldrmi r1,[r4,#0x134]` / `blxmi r1`, so a VTOR answered by
  # the busy-wait breaker (0xFFFFFFFF) or by the catch-all default (0) makes the
  # handler fetch land at 0x133 / 0x134 and kills the emulation with
  # UC_ERR_READ_UNMAPPED. VTOR is a base-address register, not a status
  # register; modelled write-through/read-back it answers 0x20000000, the value
  # the firmware itself writes at pc=0x0800c11a when it relocates the table into
  # SRAM. Everything else in the window keeps AutoPeripheral's behaviour --
  # notably the NVIC enable/pending aliases, whose busy-wait escalation is what
  # this firmware's software ISR dispatch is gated on.
  #
  # NOTE (honest, unchanged): the FULL NVIC model in that same file (CortexMScs)
  # is still NOT wired. Replacing the ISER/ICER/ISPR/ICPR escalation with a
  # faithful register file starves the uTasker scheduler (the task loop stops
  # dispatching: fnTaskEthernet runs once instead of ~10/s). Only the VTOR
  # register is modelled here.
  scs:
    base_addr: 0xE0000000
    emulate: rehostry_utasker_modbus.peripheral_models.cortex_m_scs.ScsCatchAll
    permissions: rw-
    size: 0x00100000
    properties:
      # Reset value of SCB_VTOR = machine.vector_base, until the firmware
      # relocates the table itself (it writes 0x20000000 at pc=0x0800c11a).
      vtor_reset: 0x0800c080

intercepts: []
